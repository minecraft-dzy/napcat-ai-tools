[plea]
enabled = true
server_ip = "101.132.154.198"
port = 8090
external_port = 8090
# 求情兜底轮询间隔（秒）。求情提交后会立即开线程审核，轮询只兜底代理链路上的求情。
poll_interval_seconds = 10
# 求情审核 AI（OpenAI 兼容端点），收到求情后立即调用审核
ai_base_url = "https://api.deepseek.com/v1"
ai_api_key = ""
ai_model = "deepseek-flash"
# 强制发送求情链接到群聊（双重保险）。开启后 bot 直接发 @消息 + AI 也会看到链接转发；
# 如果出现重复发两次求情链接的情况，请关闭此开关。
force_send_plea_link = true

[proxy]
enabled = true
proxy_url = "http://47.100.213.47:8787"
proxy_uuid = ""

# 加好友 / 群邀请 / 加群申请自动审核：检测到请求就调用 planner 判断是否通过。
# 注意：每次审核都会发起一次 planner 任务，频繁收到请求时可能占用较多输入 token。
[request_review]
auto_review = true
review_friend_request = true
review_group_invite = true
review_group_join = true
max_review_records = 200

[log]
rainbow = true
